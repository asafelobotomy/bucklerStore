name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install (from uv.lock)
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check scripts tests
      - name: index.json is current
        run: uv run python scripts/build_index.py --check
      - name: Pytest
        run: uv run pytest -q

[project]
name = "buckler-store"
version = "0.1.0"
description = "Catalog of widgets, colour schemes, fonts and icon packs for the Buckler TV launcher"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fonttools>=4.50"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"

# Colour schemes for Buckler. Each sets every colour the launcher draws with; tests/test_catalog.py
# holds them to the same contrast rules as Buckler's built-in schemes (text 7:1 on the background,
# 4.5:1 on tiles, and so on). Colours are #RRGGBB.
themes:
  - id: sakura
    label: Sakura
    about: Night-time plum with cherry-blossom pink and leaf green.
    dark: true
    colors:
      bgTop: "#1E1620"
      bgMid: "#261C29"
      bgBottom: "#1E1620"
      brand: "#F4A6C6"
      onBrand: "#2A1020"
      text: "#F6EDF2"
      muted: "#C9B6C2"
      hint: "#9A8794"
      section: "#9FD69A"
      tile: "#33263A"
      footer: "#403047"
      border: "#5A4762"
      ring: "#FFFFFF"

  - id: matcha

# Fonts for Buckler, all under the SIL Open Font License. scripts/gen_fonts.py fetches each family
# from the google/fonts repository at a pinned commit, cuts a Regular (400) and a Bold (700)
# instance, trims it to Latin and writes fonts/<id>/regular.ttf, bold.ttf and OFL.txt.
# scripts/build_index.py then pins each file's sha256 in index.json.
# `revision` goes up with every change (with `changes` saying what); Buckler offers the update.
